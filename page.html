<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpina Schools &amp; Colleges</title>
  <meta name="description" content="Alpina Schools & Colleges, Bahawalpur.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-snow text-ink font-body antialiased">

  <div id="top-strip" class="hidden md:block bg-brand text-white text-xs"></div>
  <header id="site-header" class="sticky top-0 z-40"></header>

  <main>
    <!-- Title bar. Title and menu group are filled in by script.js from the ?id= in the address -->
    <section class="relative bg-glacier overflow-hidden">
      <div class="max-w-6xl mx-auto px-6 pt-10 pb-16 sm:pt-14 sm:pb-20">
        <p class="text-sm text-muted"><a href="index.html" class="hover:underline">Home</a><span id="page-group"></span></p>
        <h1 id="page-title" class="mt-3 font-display font-semibold text-3xl sm:text-4xl lg:text-5xl tracking-tight break-words"></h1>
      </div>
      <!-- Ridge, same shape family as the home slider. Joins the page background -->
      <svg class="absolute bottom-0 left-0 w-full h-6 sm:h-10 pointer-events-none" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true">
        <path style="fill: var(--snow)" d="M0 80V50L180 15 300 45 470 5 650 48 820 22 1010 52 1200 12 1330 40 1440 25V80Z"/>
      </svg>
    </section>

    <!-- Page content on the left (built by script.js from pages.js), contact box on the right -->
    <section class="max-w-6xl mx-auto px-6 pt-6 pb-16 grid lg:grid-cols-12 gap-12">
      <article id="page-body" class="lg:col-span-8 space-y-6"></article>

      <aside class="lg:col-span-4 self-start lg:sticky lg:top-24 bg-surface border border-line rounded-2xl p-6 lift">
        <h2 class="font-display font-semibold text-lg">Have a question?</h2>
        <p class="mt-2 text-muted">Call the school office or send a message.</p>
        <a href="tel:+92622874852" class="block mt-4 font-medium hover:underline">+92 62 2874852</a>
        <a href="index.html#contact" class="inline-block mt-5 bg-brand text-white font-semibold px-5 py-2.5 rounded-full hover:brightness-95 smooth">Contact us</a>
      </aside>
    </section>
  </main>

  <footer id="site-footer" class="bg-deep text-white"></footer>

  <script src="pages.js"></script>
  <script src="script.js"></script>
</body>
</html>
